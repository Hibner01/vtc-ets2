<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        let currentUserId = null;
        let currentUserRole = '';

        function showExample(type) {
            // ... (Twoje inne funkcje, np. showExample, switchTab itp.) ...
        }

        // ==========================================
        // TUTAJ WKLEJASZ ZAKTUALIZOWANE FUNKCJE:
        // ==========================================

        async function checkUser() {
            const savedUser = localStorage.getItem('vtc_logged_user');
            if (!savedUser) {
                document.getElementById('auth-section').style.display = 'flex';
                document.getElementById('dashboard-section').style.display = 'none';
                return;
            }

            try {
                const res = await fetch('/api/user');
                if (res.ok) {
                    const data = await res.json();
                    currentUserId = data.id;
                    currentUserRole = data.role;
                    document.getElementById('auth-section').style.display = 'none';
                    document.getElementById('dashboard-section').style.display = 'block';
                    document.getElementById('user-display').innerText = data.username;
                    
                    if (data.role === 'admin') {
                        document.getElementById('admin-badge').classList.remove('d-none');
                        document.getElementById('admin-tab-btn').classList.remove('d-none');
                        document.getElementById('truck-form-column').style.display = 'block';
                        document.getElementById('trucks-list-column').className = 'col-md-8';
                    } else {
                        document.getElementById('admin-badge').classList.add('d-none');
                        document.getElementById('admin-tab-btn').classList.add('d-none');
                        document.getElementById('truck-form-column').style.display = 'none';
                        document.getElementById('trucks-list-column').className = 'col-md-12';
                    }

                    loadCompanyStats();

                    const km = data.monthlyKm;
                    const limit = data.limitKm;
                    const percent = Math.min(Math.round((km / limit) * 100), 100);
                    const progressBar = document.getElementById('km-progress');
                    progressBar.style.width = percent + '%';
                    progressBar.textContent = `${km} km / ${limit} km (${percent}%)`;
                    
                    if (km >= limit) {
                        progressBar.classList.add('bg-success');
                        document.getElementById('limit-status').textContent = 'Limit miesięczny osiągnięty!';
                    } else {
                        progressBar.classList.remove('bg-success');
                        document.getElementById('limit-status').textContent = `Do limitu brak: ${limit - km} km.`;
                    }

                    loadJobs();
                } else {
                    localStorage.removeItem('vtc_logged_user');
                    document.getElementById('auth-section').style.display = 'flex';
                    document.getElementById('dashboard-section').style.display = 'none';
                }
            } catch (e) {
                document.getElementById('auth-section').style.display = 'flex';
                document.getElementById('dashboard-section').style.display = 'none';
            }
        }

        async function performLogin() {
            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value.trim();

            if (!usernameInput || !passwordInput) {
                alert('Wpisz nazwę użytkownika i hasło!');
                return;
            }

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: usernameInput, password: passwordInput })
                });
                const data = await res.json();
                if (res.ok && data.success) {
                    localStorage.setItem('vtc_logged_user', usernameInput);
                    await checkUser();
                } else {
                    alert(data.error || 'Nieprawidłowy login lub hasło.');
                }
            } catch (err) {
                alert('Błąd połączenia z serwerem.');
            }
        }

        // ... (Dalsze funkcje, np. performRegister, performLogout, loadManagementUsers itp.) ...

        checkUser();
    </script> <!-- Tutaj kończy się plik -->
</body>
</html>
